version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    staticcheck:
      # golangci-lint disables some stylistic checks by default; enable
      # the full staticcheck suite.
      checks:
        - all
  exclusions:
    rules:
      # The e2e suite drives external tools (kubectl, helm, bink) with
      # computed arguments by design.
      - path: ^test/e2e/
        linters:
          - gosec
