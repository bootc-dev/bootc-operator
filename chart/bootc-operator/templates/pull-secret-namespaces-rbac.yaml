{{- range without (.Values.pullSecretNamespaces | uniq) $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bootc-operator.fullname" $ }}-pull-secrets
  namespace: {{ . }}
  labels:
    {{- include "bootc-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bootc-operator.fullname" $ }}-pull-secrets
  namespace: {{ . }}
  labels:
    {{- include "bootc-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bootc-operator.fullname" $ }}-pull-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "bootc-operator.fullname" $ }}-controller
  namespace: {{ $.Release.Namespace }}
{{- end }}
