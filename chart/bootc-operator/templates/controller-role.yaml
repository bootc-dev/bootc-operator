apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bootc-operator.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bootc-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
    - get
    - list
    - watch
- apiGroups:
    - ""
  resourceNames:
    - bootc-pull-secrets
  resources:
    - secrets
  verbs:
    - patch
    - update
