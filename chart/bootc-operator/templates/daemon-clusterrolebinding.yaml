apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bootc-operator.fullname" . }}-daemon
  labels:
    {{- include "bootc-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bootc-operator.fullname" . }}-daemon
subjects:
  - kind: ServiceAccount
    name: {{ include "bootc-operator.fullname" . }}-daemon
    namespace: {{ .Release.Namespace }}
