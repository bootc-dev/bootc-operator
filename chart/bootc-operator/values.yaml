nameOverride: bootc-operator

crds:
  install: true

image:
  repository: ghcr.io/bootc-dev/bootc-operator
  tag: ""
  pullPolicy: ""

imagePullSecrets: []

controller:
  extraArgs: []

metrics:
  enabled: true
  service:
    port: 8443
  serviceMonitor:
    # When enabled, bind the metrics-reader ClusterRole to your
    # Prometheus ServiceAccount so it can access /metrics.
    enabled: false
    interval: 30s
    namespace: ""
