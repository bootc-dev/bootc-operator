name: Helm

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main, release-*]

env:
  BINK_COMMIT: c7c4013e1275f07fe6ee90be92b61d256117460f

permissions:
  contents: read

concurrency:
  group: helm-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-bink:
    uses: $/.github/workflows/build-bink.yaml
    with:
      bink-commit: c7c4013e1275f07fe6ee90be92b61d256117460f

  build-operator:
    uses: $/.github/workflows/build-operator.yaml

  helm-e2e:
    runs-on: ubuntu-latest
    needs: [build-bink, build-operator]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BINK_NODE_DISK_IMAGE: ghcr.io/bootc-dev/bink/node@sha256:d3077c99027db0c196d5c6531ef07b8955be827651b9e3d2bc4b8e7c6ebf5612
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download bink binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bink
          path: /usr/local/bin

      - name: Make bink executable
        run: chmod +x /usr/local/bin/bink

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning]

      - name: Set up bink environment
        uses: $/.github/actions/setup-bink-env

      - name: Download operator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operator-image

      - name: Load operator image
        run: podman load -i operator-image.tar

      - name: Start bink cluster
        run: make start-bink

      - name: Build update images
        run: make build-update-image

      - name: Push operator image to bink registry
        run: podman push --tls-verify=false bootc-operator:dev localhost:5000/bootc-operator:dev

      - name: Generate Helm chart
        run: make helm

      - name: Install Helm chart
        run: |
          helm install bootc-operator ./chart/bootc-operator \
            --kubeconfig $(pwd)/kubeconfig-e2e \
            --create-namespace --namespace bootc-operator \
            --set image.repository=registry.cluster.local:5000/bootc-operator \
            --set image.tag=dev \
            --set image.pullPolicy=Always \
            --set-json 'controller.extraArgs=["--allow-insecure-registry"]'

      - name: Verify controller is running
        run: |
          kubectl --kubeconfig $(pwd)/kubeconfig-e2e -n bootc-operator \
            rollout status deployment/bootc-operator-controller --timeout=3m
          kubectl --kubeconfig $(pwd)/kubeconfig-e2e -n bootc-operator \
            get pods

      - name: Run e2e smoke tests
        run: make e2e RUN='TestCRDSmoke|TestControllerMembership' V=1

      - name: Gather logs on failure
        if: failure()
        run: make gather-bink

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-e2e-logs
          path: _output/logs/
          if-no-files-found: ignore
